[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-phenotype-reproducibility"
version = "0.1.0"
description = "Research code for missing-data and medoid sensitivity in sepsis phenotyping"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
analysis = ["scipy", "scikit-learn", "statsmodels", "kmedoids", "numba", "pyarrow", "google-cloud-bigquery", "db-dtypes", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
